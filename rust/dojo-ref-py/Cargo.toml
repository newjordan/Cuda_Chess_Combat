[package]
name = "dojo-ref-py"
version = "0.1.0"
edition.workspace = true
description = "Python bindings for the dojo-ref chess referee"
license.workspace = true

[lib]
name = "dojo_ref"
crate-type = ["cdylib"]

[features]
default = ["gpu"]
gpu = ["dojoref/gpu"]
cpu = ["dojoref/cpu"]

[dependencies]
dojoref = { package = "dojo-ref", path = "../dojo-ref", default-features = false }
pyo3 = { version = "0.28", features = ["extension-module"] }
